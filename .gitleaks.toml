# ──────────────────────────────────────────────────────────────────────────────
# Gitleaks config — alluv-website (PUBLIC repo)
#
# Deliberately NOT copied from any private house config. This repository is public,
# so it carries only the upstream default ruleset plus allowlists that a static site
# actually needs. Rules and allowlists belonging to private projects must never be
# added here.
# ──────────────────────────────────────────────────────────────────────────────

title = "alluv-website gitleaks config"

# Maintained upstream default rules — wide coverage, no local weakening.
[extend]
useDefault = true

[allowlist]
description = "Placeholders and public-by-design values"

regexes = [
  # Common documentation placeholders.
  '''YOUR_[A-Z0-9_]+''',
  '''<[A-Za-z0-9_\- .]*?(?:REDACTED|PASSWORD|SECRET|KEY|TOKEN|your[_-]?[a-z]*)[A-Za-z0-9_\- .]*?>''',
  '''\$\{[A-Z0-9_]+\}''',
  '''(?:xxx+|XXX+|changeme|CHANGEME|placeholder|PLACEHOLDER|example|EXAMPLE)''',
]

paths = [
  '''(^|/)\.git/''',
  '''\.(png|jpe?g|gif|webp|ico|pdf|ttf|woff2?)$''',
]
